# Продакшен на одном сервере (4 vCPU / 12 ГБ): scripts/deploy.sh копирует проект в ~/zhkh и запускает этот файл.
# Снаружи открыты только 80/443 (Caddy, HTTPS). Postgres, Qdrant и API доступны только внутри docker-сети.
name: zhkh

services:
  postgres:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: zhkh24
      POSTGRES_USER: zhkh24
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhkh24 -d zhkh24"]
      interval: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant:/qdrant/storage
      - ./snapshots:/qdrant/snapshots

  api:
    build: ../../apps/api
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://zhkh24:${POSTGRES_PASSWORD}@postgres:5432/zhkh24
      QDRANT_URL: http://qdrant:6333
      ML_DEVICE: cpu
    volumes:
      - hf:/srv/hf
      - ../../data:/srv/data
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
    mem_limit: 9g

  web:
    build: ../../apps/web
    restart: unless-stopped
    depends_on: [api]
    mem_limit: 1g

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?задайте SITE_ADDRESS в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  pgdata:
  qdrant:
  hf:
  caddy_data:
  caddy_config:
